<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spesa</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-v2.png">
<link rel="icon" href="icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181B" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F1F2F0; --card:#FFFFFF; --ink:#1C1B17; --mute:#66645C; --line:#DCDDD8;
  --accent:#FFD60A; --accent-ink:#1C1B17; --accent-text:#8A6A00;
  --warn:#C2410C; --bad:#B42318; --cell:#DCDDD8; --key:#FFFFFF; --key-alt:#E6E7E3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18181B; --card:#222226; --ink:#F2F1EC; --mute:#A3A29B; --line:#34343A;
    --accent:#FFD60A; --accent-ink:#1C1B17; --accent-text:#FFD60A;
    --warn:#FB923C; --bad:#F97066; --cell:#34343A; --key:#2C2C31; --key-alt:#38383E;
  }
}
:root[data-theme="dark"]{
  --bg:#18181B; --card:#222226; --ink:#F2F1EC; --mute:#A3A29B; --line:#34343A;
  --accent:#FFD60A; --accent-ink:#1C1B17; --accent-text:#FFD60A;
  --warn:#FB923C; --bad:#F97066; --cell:#34343A; --key:#2C2C31; --key-alt:#38383E;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}

.top{padding:14px 20px 10px}
.label{margin:0;font-size:.9rem;color:var(--mute)}
.total{margin:0 0 4px;font-size:2.8rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.buoni{margin:0;font-size:1.25rem;font-weight:650;color:var(--accent-text)}
.buoni.over{color:var(--warn)}
.hint{margin:2px 0 0;font-size:.92rem;color:var(--mute);min-height:1.35em;line-height:1.35}
.hint.err{color:var(--bad)}
.meter{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}
.meter i{height:10px;border-radius:3px;background:var(--cell)}
.meter i.on{background:var(--accent)}
.meter.over i.on{background:var(--warn)}

.list{flex:1;overflow-y:auto;margin:0;padding:0 20px;list-style:none}
.list li{display:flex;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:1.1rem}
.list li:last-child{border-bottom:1px solid var(--line)}
.list .n{color:var(--mute);font-size:.9rem;margin-right:10px;min-width:1.8em}
.list .p{flex:1}
.list .q{color:var(--mute);font-size:.95rem;margin-left:6px}
.list .sub{font-weight:650;margin-left:10px}
.del{border:0;background:transparent;color:var(--mute);font-size:1.5rem;line-height:1;width:44px;height:44px;border-radius:10px;cursor:pointer}
.del:hover{color:var(--bad)}
.empty{padding:20px 0;color:var(--mute);line-height:1.5}

.bar{padding:10px 12px 10px;background:var(--card);border-top:1px solid var(--line)}
.screen{
  display:flex;align-items:baseline;justify-content:flex-end;gap:10px;
  border:2px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--bg);
  font-size:1.8rem;font-weight:650;min-height:58px;
}
.screen.err{border-color:var(--bad)}
.screen .val.zero{color:var(--mute);font-weight:400}
.screen .qty{font-size:1.1rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 8px}
.screen .qty[hidden]{display:none}

.chips{display:flex;gap:8px;overflow-x:auto;margin:8px 0;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-size:.98rem;padding:8px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--key-alt);
}
.chip.rep{font-weight:650;color:var(--accent-text);background:transparent;border-color:var(--accent-text)}
.chip:disabled{opacity:.4;cursor:default}
.chips .none{color:var(--mute);font-size:.9rem;padding:8px 2px}

.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{
  height:52px;border:0;border-radius:12px;background:var(--key);cursor:pointer;
  font-size:1.5rem;font-weight:600;box-shadow:0 1px 0 var(--line);
}
.k:active{background:var(--key-alt)}
.k.fn{background:var(--key-alt);font-size:1.1rem}
.k.fn.on{background:var(--accent);color:var(--accent-ink)}
.k.go{background:var(--accent);color:var(--accent-ink);font-size:2rem;font-weight:700}
.k.go:active{filter:brightness(.92)}

.tools{display:flex;justify-content:space-between;margin-top:6px}
.tools button{
  font-size:.95rem;color:var(--mute);background:transparent;border:0;
  padding:10px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}
.tools button.sure{color:var(--bad);font-weight:650}
.tools button:disabled{opacity:.4;cursor:default;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <section class="top" aria-live="polite">
    <p class="label">Totale spesa</p>
    <p id="total" class="total">0,00 €</p>
    <p id="buoni" class="buoni">Aggiungi il primo prezzo</p>
    <p id="hint" class="hint"></p>
    <div id="meter" class="meter" role="img" aria-label="Buoni usati su 8"></div>
  </section>

  <ul id="list" class="list"></ul>

  <div class="bar">
    <div id="screen" class="screen" aria-live="polite">
      <span id="qtag" class="qty" hidden></span>
      <span id="val" class="val zero">0,00 €</span>
    </div>

    <div id="chips" class="chips"></div>

    <div id="pad" class="pad">
      <button class="k" type="button" data-k="1">1</button>
      <button class="k" type="button" data-k="2">2</button>
      <button class="k" type="button" data-k="3">3</button>
      <button class="k fn" type="button" data-k="back" aria-label="Cancella una cifra">⌫</button>
      <button class="k" type="button" data-k="4">4</button>
      <button class="k" type="button" data-k="5">5</button>
      <button class="k" type="button" data-k="6">6</button>
      <button class="k fn" type="button" data-k="x2" id="x2">×2</button>
      <button class="k" type="button" data-k="7">7</button>
      <button class="k" type="button" data-k="8">8</button>
      <button class="k" type="button" data-k="9">9</button>
      <button class="k fn" type="button" data-k="x3" id="x3">×3</button>
      <button class="k fn" type="button" data-k="paste">Incolla</button>
      <button class="k" type="button" data-k="0">0</button>
      <button class="k" type="button" data-k="00">00</button>
      <button class="k go" type="button" data-k="add" aria-label="Aggiungi al totale">+</button>
    </div>

    <div class="tools">
      <button id="undo" type="button">Annulla ultimo</button>
      <button id="clear" type="button">Svuota carrello</button>
    </div>
  </div>
</div>

<script>
(function(){
  var VAL = 800, MAXB = 8, KEY = 'spesa-buoni-v2', RKEY = 'spesa-recenti';
  var items = [], recent = [], buf = '', qty = 1, armed = false;

  var $ = function(id){ return document.getElementById(id); };
  var list = $('list'), clearBtn = $('clear'), undoBtn = $('undo'), hint = $('hint');

  // Carica il carrello (e converte quello della versione precedente)
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      items = (JSON.parse(raw) || []).filter(function(x){
        return x && Number.isInteger(x.p) && Number.isInteger(x.q) && x.p > 0 && x.q > 0;
      });
    } else {
      items = (JSON.parse(localStorage.getItem('spesa-buoni') || '[]') || [])
        .filter(Number.isInteger).map(function(p){ return {p:p, q:1}; });
    }
  } catch(e){ items = []; }
  try { recent = (JSON.parse(localStorage.getItem(RKEY) || '[]') || []).filter(Number.isInteger).slice(0,4); } catch(e){ recent = []; }

  function eur(c){ return (c/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' \u20ac'; }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(items)); localStorage.setItem(RKEY, JSON.stringify(recent)); } catch(e){}
  }
  function remember(p){
    recent = recent.filter(function(x){ return x !== p; });
    recent.unshift(p);
    recent = recent.slice(0,4);
  }
  function addItem(p, q){
    items.push({p:p, q:q});
    remember(p);
    qty = 1;
    save(); render();
  }

  function render(){
    var total = items.reduce(function(a,it){ return a + it.p * it.q; }, 0);
    $('total').textContent = eur(total);

    var full = Math.floor(total / VAL), over = full > MAXB, used = Math.min(full, MAXB);
    var covered = used * VAL, rest = total - covered;
    var buoni = $('buoni');
    buoni.classList.toggle('over', over);
    hint.classList.remove('err');
    $('screen').classList.remove('err');

    if (total === 0){
      buoni.textContent = 'Aggiungi il primo prezzo';
      hint.textContent = 'Digita in centesimi: 2 4 9 fa 2,49 \u20ac.';
    } else if (used === 0){
      buoni.textContent = 'Ancora sotto 8 \u20ac';
      hint.textContent = 'Mancano ' + eur(VAL - total) + ' per usare il primo buono.';
    } else {
      buoni.textContent = 'Usa ' + used + (used === 1 ? ' buono' : ' buoni') + ' (' + eur(covered) + ')';
      if (rest === 0) hint.textContent = 'Quadra perfetto, niente da pagare in pi\u00f9.';
      else if (over) hint.textContent = 'Il resto di ' + eur(rest) + ' lo paghi con un altro metodo.';
      else hint.textContent = 'Il resto di ' + eur(rest) + ' lo paghi con carta o contanti. Con altri ' + eur(VAL - rest) + ' usi un buono in pi\u00f9.';
    }

    var m = $('meter');
    m.classList.toggle('over', over);
    m.innerHTML = '';
    for (var i = 0; i < MAXB; i++){
      var c = document.createElement('i');
      if (i < used) c.className = 'on';
      m.appendChild(c);
    }

    // Elenco prodotti, il più recente in alto
    list.innerHTML = '';
    if (!items.length){
      var e = document.createElement('li');
      e.className = 'empty';
      e.textContent = 'Nessun prezzo. Digitalo sul tastierino e premi +.';
      list.appendChild(e);
    } else {
      for (var k = items.length - 1; k >= 0; k--){
        (function(idx){
          var it = items[idx];
          var li = document.createElement('li');
          var n = document.createElement('span'); n.className = 'n'; n.textContent = (idx+1) + '.';
          var p = document.createElement('span'); p.className = 'p'; p.textContent = eur(it.p);
          if (it.q > 1){
            var q = document.createElement('span'); q.className = 'q'; q.textContent = '\u00d7 ' + it.q;
            p.appendChild(q);
          }
          li.appendChild(n); li.appendChild(p);
          if (it.q > 1){
            var s = document.createElement('span'); s.className = 'sub'; s.textContent = eur(it.p * it.q);
            li.appendChild(s);
          }
          var d = document.createElement('button'); d.type = 'button'; d.className = 'del';
          d.textContent = '\u00d7'; d.setAttribute('aria-label', 'Elimina ' + eur(it.p));
          d.onclick = function(){ items.splice(idx,1); save(); render(); };
          li.appendChild(d);
          list.appendChild(li);
        })(k);
      }
    }

    // Display del prezzo in digitazione
    var v = $('val'), qt = $('qtag');
    v.textContent = eur(buf ? parseInt(buf, 10) : 0);
    v.classList.toggle('zero', !buf);
    qt.hidden = qty === 1;
    qt.textContent = qty + ' \u00d7';
    $('x2').classList.toggle('on', qty === 2);
    $('x3').classList.toggle('on', qty === 3);

    // Ripeti + prezzi recenti
    var ch = $('chips');
    ch.innerHTML = '';
    var rep = document.createElement('button');
    rep.type = 'button'; rep.className = 'chip rep'; rep.dataset.act = 'rep';
    rep.textContent = items.length ? 'Ripeti ' + eur(items[items.length-1].p) : 'Ripeti ultimo';
    rep.disabled = !items.length;
    ch.appendChild(rep);
    if (recent.length){
      recent.forEach(function(p){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.dataset.p = p;
        b.textContent = eur(p);
        ch.appendChild(b);
      });
    } else {
      var none = document.createElement('span');
      none.className = 'none'; none.textContent = 'Qui compariranno i prezzi recenti';
      ch.appendChild(none);
    }

    undoBtn.disabled = clearBtn.disabled = !items.length;
    if (!items.length) disarm();
  }

  function flash(msg){
    hint.textContent = msg;
    hint.classList.add('err');
    $('screen').classList.add('err');
  }

  // Legge un prezzo da testo incollato: "€ 2,49", "2.49", "2 49", "3"
  function parse(s){
    s = String(s).replace(/\u20ac|EUR/gi, ' ').trim();
    var m, c;
    if ((m = s.match(/\d+[.,]\d{1,2}(?!\d)/))) c = Math.round(parseFloat(m[0].replace(',', '.')) * 100);
    else if ((m = s.match(/^\D*(\d+)\s+(\d{2})\D*$/))) c = parseInt(m[1],10) * 100 + parseInt(m[2],10);
    else if ((m = s.match(/^\D*(\d+)\D*$/))) c = parseInt(m[1],10) * 100;
    else return null;
    return (c > 0 && c < 100000) ? c : null;
  }
  function takePasted(s){
    var c = parse(s);
    if (c === null){ flash('Negli appunti non c\u2019\u00e8 un prezzo valido.'); return; }
    buf = String(c);
    render();
  }
  function doPaste(){
    if (navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(takePasted, function(){ flash('Non riesco a leggere gli appunti.'); });
    } else {
      flash('Incolla non disponibile in questo browser.');
    }
  }

  function press(k){
    if (/^\d$/.test(k) || k === '00'){
      if (!buf && (k === '0' || k === '00')) return;
      if ((buf + k).length > 5) return;
      buf += k;
    } else if (k === 'back'){
      buf = buf.slice(0, -1);
    } else if (k === 'x2' || k === 'x3'){
      var n = k === 'x2' ? 2 : 3;
      if (!buf && items.length){
        // Nessun prezzo in digitazione: cambia la quantità dell'ultimo prodotto
        var last = items[items.length-1];
        last.q = last.q === n ? 1 : n;
        save();
      } else {
        qty = qty === n ? 1 : n;
      }
    } else if (k === 'add'){
      if (!buf){ flash('Digita prima un prezzo, per esempio 2 4 9 per 2,49 \u20ac.'); return; }
      var p = parseInt(buf, 10);
      buf = '';
      addItem(p, qty);
      return;
    } else if (k === 'paste'){
      doPaste();
      return;
    }
    disarm();
    render();
  }

  $('pad').addEventListener('click', function(e){
    var b = e.target.closest('[data-k]');
    if (b) press(b.dataset.k);
  });

  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.act === 'rep'){
      var last = items[items.length-1];
      if (last.q < 99){ last.q += 1; save(); render(); }
    } else if (b.dataset.p){
      buf = '';
      addItem(parseInt(b.dataset.p, 10), qty);
    }
  });

  // Tastiera fisica e incolla (computer)
  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^\d$/.test(e.key)){ e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace'){ e.preventDefault(); press('back'); }
    else if (e.key === 'Enter' || e.key === '+'){
      if (e.target.closest && e.target.closest('button') && e.key === 'Enter') return;
      e.preventDefault(); press('add');
    }
  });
  document.addEventListener('paste', function(e){
    var t = (e.clipboardData || window.clipboardData).getData('text');
    if (t){ e.preventDefault(); takePasted(t); }
  });

  function disarm(){ armed = false; clearBtn.classList.remove('sure'); clearBtn.textContent = 'Svuota carrello'; }

  undoBtn.onclick = function(){
    var last = items[items.length-1];
    if (!last) return;
    if (last.q > 1) last.q -= 1; else items.pop();
    save(); render();
  };
  clearBtn.onclick = function(){
    if (!armed){ armed = true; clearBtn.classList.add('sure'); clearBtn.textContent = 'Tocca ancora per svuotare'; return; }
    items = []; buf = ''; qty = 1; save(); disarm(); render();
  };

  render();
})();
</script>
</body>
</html>
